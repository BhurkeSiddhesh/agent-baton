name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity for tests that commit
        shell: bash
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: Full regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log
      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-${{ matrix.os }}-node${{ matrix.node }}
          path: full-test.log
          if-no-files-found: ignore
          retention-days: 7

  git_baseline:
    name: Git 2.30 baseline (Debian 11, Node 18)
    runs-on: ubuntu-latest
    container: node:18-bullseye@sha256:0d9e9a8dcd5a83ea737ed92227a6591a31ad70c8bb722b0c51aff7ae23a88b6a
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require the declared minimum Git series
        shell: bash
        run: |
          set -eu
          git --version
          git --version | grep -E '^git version 2\.30\.'
      - name: Git identity for tests that commit
        shell: bash
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: Full regression suite at the Git baseline
        run: npm test
      - name: Compatibility fixture at the Git baseline
        run: node .github/scripts/platform-smoke.mjs

  unit:
    name: unit tests (linux, node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Git identity for unit fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: Unit tests
        run: node --test tests/lib-*.test.js

  integration:
    name: integration and end-to-end (linux, node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Git identity for isolated integration fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: CLI and integration tests
        run: node --test tests/cmd-*.test.js tests/e2e.test.js tests/integration-*.test.js tests/install-*.test.js

  security:
    name: security regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Git identity for security fixtures
        shell: bash
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: Security regression suite
        shell: bash
        run: |
          set -o pipefail
          node --test tests/cmd-exec-guard.test.js tests/lib-secrets.test.js tests/lib-lock.test.js tests/security-model-docs.test.js 2>&1 | tee security-test.log
      - name: Upload security failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.os }}
          path: security-test.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: package integrity and offline install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pack distribution without publishing
        run: npm pack --json > pack.json
      - name: Check archive manifest, required runtime and forbidden files
        run: node .github/scripts/validate-package.mjs pack.json
      - name: Measure core archive and startup budgets
        run: node .github/scripts/offline-core-metrics.mjs pack.json offline-core-metrics.json
      - name: Network-denial core smoke
        run: node --import ./.github/scripts/deny-network.mjs bin/baton.js version
      - name: Verify installation from the actual tarball offline
        shell: bash
        run: |
          set -eu
          TARBALL="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].filename)')"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm install --offline --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"
          "$TMP/node_modules/.bin/agent-baton" version
          "$TMP/node_modules/.bin/baton" version
          PROJECT="$(mktemp -d)"
          cd "$PROJECT"
          git init -q
          printf '{"name":"packed-smoke","scripts":{"test":"node -e 0"}}\\n' > package.json
          "$TMP/node_modules/.bin/agent-baton" init --yes --agents claude,codex --test-cmd 'node -e "process.exit(0)"'
          node .baton/runtime/bin/baton.js doctor
          node .baton/runtime/bin/baton.js check
      - name: Retain package manifest
        uses: actions/upload-artifact@v4
        with:
          name: package-manifest
          path: |
            pack.json
            offline-core-metrics.json
          retention-days: 7

  smoke:
    name: smoke init and doctor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Init and doctor in a temporary repository
        shell: bash
        run: |
          set -eu
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
          BATON="$GITHUB_WORKSPACE/bin/baton.js"
          TMP="$(mktemp -d)"
          cd "$TMP"
          git init -q
          printf '{"name":"smoke","scripts":{"test":"node -e 0"}}\n' > package.json
          git add -A
          git commit -q -m "initial"
          node "$BATON" init --yes --agents claude,codex,gemini --cloud --hooks
          node "$BATON" init --yes --agents claude,codex,gemini --cloud --hooks
          node .baton/runtime/bin/baton.js doctor
          node .baton/runtime/bin/baton.js check
          node .baton/runtime/bin/baton.js status --json
          node .baton/runtime/bin/baton.js uninstall --yes --dry-run

      - name: Unicode, spaces and CRLF (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: node .github/scripts/platform-smoke.mjs
      - name: PowerShell compatibility
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: node .github/scripts/platform-smoke.mjs
      - name: cmd.exe compatibility
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: node .github/scripts/platform-smoke.mjs
      - name: Git Bash compatibility
        if: matrix.os == 'windows-latest'
        shell: bash
        run: node .github/scripts/platform-smoke.mjs

  docs:
    name: docs links and generated commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relative links and anchors resolve
        run: node .github/scripts/check-links.mjs
      - name: docs/COMMANDS.md is up to date
        run: |
          node .github/scripts/gen-commands.mjs
          git diff --exit-code docs/COMMANDS.md

  release_ready:
    name: release gate (all required checks)
    # Validate version tags even when a prerequisite is cancelled or fails.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [test, git_baseline, unit, integration, security, package, smoke, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refuse failed, cancelled, skipped or missing check results
        shell: bash
        run: |
          node .github/scripts/assert-required-ci.mjs \
            "${{ needs.test.result }}" \
            "${{ needs.git_baseline.result }}" \
            "${{ needs.unit.result }}" \
            "${{ needs.integration.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.package.result }}" \
            "${{ needs.smoke.result }}" \
            "${{ needs.docs.result }}"
      - name: Reject a source tag different from package version
        run: node .github/scripts/assert-release-tag.mjs "${GITHUB_REF_NAME}"

  release_candidate:
    name: release candidate tarball (gated)
    # Artifact-only: publishing requires a separately authorized release action.
    if: startsWith(github.ref, 'refs/tags/v') && needs.release_ready.result == 'success'
    needs: [release_ready]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify source version and pack exact tagged tree
        shell: bash
        run: |
          set -eu
          node .github/scripts/assert-release-tag.mjs "${GITHUB_REF_NAME}"
          npm pack --json > pack.json
          node .github/scripts/validate-package.mjs pack.json
          node .github/scripts/write-package-checksum.mjs pack.json SHA256SUMS
      - name: Retain independently installable candidate and its SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            *.tgz
            pack.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  branch_ready:
    name: branch protection gate (all required CI checks)
    if: always() && !startsWith(github.ref, 'refs/tags/v')
    needs: [test, git_baseline, unit, integration, security, package, smoke, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject failed, cancelled or skipped prerequisites
        shell: bash
        run: |
          node .github/scripts/assert-required-ci.mjs \
            "${{ needs.test.result }}" \
            "${{ needs.git_baseline.result }}" \
            "${{ needs.unit.result }}" \
            "${{ needs.integration.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.package.result }}" \
            "${{ needs.smoke.result }}" \
            "${{ needs.docs.result }}"
