name: coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: test coverage baseline (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Git identity for temporary test repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: Collect test coverage and V8 machine data
        shell: bash
        env:
          NODE_V8_COVERAGE: coverage/v8
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-summary.txt
      - name: Export aggregate coverage percentages
        run: node .github/scripts/parse-coverage.mjs coverage-summary.txt coverage-summary.json
      - name: Publish baseline and diagnostics (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node20-coverage
          path: |
            coverage-summary.txt
            coverage-summary.json
            coverage/v8/*.json
          if-no-files-found: warn
          retention-days: 14
