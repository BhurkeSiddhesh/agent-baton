<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="260" viewBox="0 0 1320 260" role="img" aria-labelledby="t d"><title id="t">Agent Baton workflow</title><desc id="d">Eight steps: plan, split, assign, begin, verify, submit, review, accept. Each step is appended to a ledger underneath.</desc><style>:root{--bg:#FFFFFF;--box:#F1F5F9;--line:#CBD5E1;--ink:#0F172A;--mut:#475569;--acc:#FF6B35}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--box:#18213D;--line:#334155;--ink:#F1F5F9;--mut:#94A3B8}}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:2}.box.hot{stroke:var(--acc);stroke-width:3}
.n{fill:var(--acc);font:700 14px ui-monospace,Consolas,Menlo,monospace}.l{fill:var(--ink);font:600 19px ui-sans-serif,system-ui,'Segoe UI',Roboto,Arial,sans-serif}
.ar,.tk{fill:none;stroke:var(--mut);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.tk{stroke:var(--line);stroke-dasharray:2 6}
.dot{fill:var(--acc)}.led{fill:var(--box);stroke:var(--acc);stroke-width:2.5}
.lt{fill:var(--ink);font:600 17px ui-monospace,Consolas,Menlo,monospace}.sm{fill:var(--mut);font:15px ui-sans-serif,system-ui,'Segoe UI',Roboto,Arial,sans-serif}</style>
<rect class="bg" width="1320" height="260"/><rect class="box" x="24" y="60" width="124" height="64" rx="12"/><text class="n" x="86" y="84" text-anchor="middle">1</text><text class="l" x="86" y="109" text-anchor="middle">plan</text><path class="ar" d="M152 92H184M176 86L184 92L176 98"/><path class="tk" d="M86 124V176"/><circle class="dot" cx="86" cy="176" r="4"/><rect class="box" x="188" y="60" width="124" height="64" rx="12"/><text class="n" x="250" y="84" text-anchor="middle">2</text><text class="l" x="250" y="109" text-anchor="middle">split</text><path class="ar" d="M316 92H348M340 86L348 92L340 98"/><path class="tk" d="M250 124V176"/><circle class="dot" cx="250" cy="176" r="4"/><rect class="box" x="352" y="60" width="124" height="64" rx="12"/><text class="n" x="414" y="84" text-anchor="middle">3</text><text class="l" x="414" y="109" text-anchor="middle">assign</text><path class="ar" d="M480 92H512M504 86L512 92L504 98"/><path class="tk" d="M414 124V176"/><circle class="dot" cx="414" cy="176" r="4"/><rect class="box" x="516" y="60" width="124" height="64" rx="12"/><text class="n" x="578" y="84" text-anchor="middle">4</text><text class="l" x="578" y="109" text-anchor="middle">begin</text><path class="ar" d="M644 92H676M668 86L676 92L668 98"/><path class="tk" d="M578 124V176"/><circle class="dot" cx="578" cy="176" r="4"/><rect class="box" x="680" y="60" width="124" height="64" rx="12"/><text class="n" x="742" y="84" text-anchor="middle">5</text><text class="l" x="742" y="109" text-anchor="middle">verify</text><path class="ar" d="M808 92H840M832 86L840 92L832 98"/><path class="tk" d="M742 124V176"/><circle class="dot" cx="742" cy="176" r="4"/><rect class="box" x="844" y="60" width="124" height="64" rx="12"/><text class="n" x="906" y="84" text-anchor="middle">6</text><text class="l" x="906" y="109" text-anchor="middle">submit</text><path class="ar" d="M972 92H1004M996 86L1004 92L996 98"/><path class="tk" d="M906 124V176"/><circle class="dot" cx="906" cy="176" r="4"/><rect class="box" x="1008" y="60" width="124" height="64" rx="12"/><text class="n" x="1070" y="84" text-anchor="middle">7</text><text class="l" x="1070" y="109" text-anchor="middle">review</text><path class="ar" d="M1136 92H1168M1160 86L1168 92L1160 98"/><path class="tk" d="M1070 124V176"/><circle class="dot" cx="1070" cy="176" r="4"/><rect class="box hot" x="1172" y="60" width="124" height="64" rx="12"/><text class="n" x="1234" y="84" text-anchor="middle">8</text><text class="l" x="1234" y="109" text-anchor="middle">accept</text><path class="tk" d="M1234 124V176"/><circle class="dot" cx="1234" cy="176" r="4"/>
<rect class="led" x="24" y="184" width="1272" height="68" rx="12"/>
<text class="lt" x="46" y="214">ledger  .baton/events.jsonl</text>
<text class="sm" x="46" y="238">append-only, hash-chained: every step above writes one event, nothing is edited in place</text>
<text class="sm" x="1296" y="38" text-anchor="end">reviewer must differ from the author</text></svg>
